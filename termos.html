<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termos de Serviço — Leviã</title>
<meta http-equiv="refresh" content="0; url=https://leviapp.org/termos">
<link rel="canonical" href="https://leviapp.org/termos">
<meta name="robots" content="noindex">
<style>
  :root { --bg: #FBF8F3; --texto: #2E3A35; --suave: #5F6B66; --marca: #4E8A72; --borda: #E3DED4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1F1C; --texto: #F1EDE6; --suave: #B4BDB8; --marca: #85AF9A; --borda: #2F3833; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto); font: 17px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 2rem; margin: 0 0 4px; color: var(--marca); }
  p { margin: 1rem 0; }
  a { color: var(--marca); }
  .destaque { background: color-mix(in srgb, var(--marca) 12%, transparent); border-radius: 12px; padding: 12px 16px; }
  .botao { display: inline-block; background: var(--marca); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; }
  .rodape { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--borda); color: var(--suave); font-size: .95rem; }
</style>
<script>location.replace('https://leviapp.org/termos');</script>
</head>
<body>
<main>
<h1>Termos de Serviço — Leviã</h1>
<p class="destaque">Os Termos de Serviço oficiais agora ficam dentro do próprio app, em <strong>leviapp.org/termos</strong>. Esta página apenas encaminha você para lá.</p>
<p><a class="botao" href="https://leviapp.org/termos">Abrir os Termos de Serviço</a></p>
<p class="rodape">Se o redirecionamento não acontecer, use o botão acima. Veja também a <a href="privacidade.html">Política de Privacidade</a>.</p>
</main>
</body>
</html>
